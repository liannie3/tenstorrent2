# ---------------- Model ----------------
model:
  name: openai/clip-vit-large-patch14-336   # Hugging Face checkpoint (frozen)
  layer_index: -2          # hidden layer fed to projector (LLaVA-1.5 style)          !!! Check with Saby !!!
  keep_cls: true           # 577 tokens = 576 patches + CLS (paper §3.4)                    
  projector_weights: null  # null = random init until trained weights are available   !!! Check with Saby !!!
  projector_out_dim: 2048  # TinyLlama-1.1B embedding width (paper §3.3)

# ---------------- Run ----------------
run:
  device: auto             # cuda on Jetson, cpu on other platforms
  precision: auto          
  batch_sizes: [1, 2, 4, 8]  # one sub-test per batch size, each over data.max_images images
  max_batches: null        # null = run all batches; N = stop after N batches (per sub-test)
  warmup_iters: 20        
  timed_iters: 200
  seed: 0

# ---------------- Data ----------------
data:
  path: data/images/CAM_FRONT    # Path to nuScenese Images (Front View)
  image_size: 336
  max_images: 128               # null = all keyframes (404 in mini); N = first N after stride
  stride: 1                      # take every Nth frame; >1 spreads the sample across scenes

# ---------------- Correctness ----------------
parity:
  golden_path: golden/vitl14_336_fp32_cpu.npz
  threshold: 0.999         # min cosine similarity vs golden to accept a run

# ---------------- Hardware ----------------
hardware:
  tegrastats_interval_ms: 100

# ---------------- Output ----------------
output:
  results_dir: results