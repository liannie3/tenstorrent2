[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clip-bench"
version = "0.1.0"
description = "CLIP ViT-L/14-336 + MLP projector benchmarking harness (CPU baseline, NVIDIA Jetson)"
requires-python = ">=3.10"

# torch is deliberately absent. The Orin needs NVIDIA's JetPack wheel from their
# index rather than the one on PyPI, so torch gets installed per machine first
# and `pip install -e .` fills in the rest.
dependencies = [
    "transformers>=5.0",
    "pillow",
    "numpy",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]
notebook = ["jupyter", "ipykernel"]

[tool.setuptools.packages.find]
include = ["clipbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
