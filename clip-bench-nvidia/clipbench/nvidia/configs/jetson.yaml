## YAML file for Jetson AGX Orin

run:
  target: nvidia                 # run with clipbench/nvidia/run.py -- CUDA event stage timing
  device: cuda                   
  precision: fp16                # data type
  cuda_graph: false              # true = replay CUDA graphs (match tt.yaml trace: true); results go to results_dir + _cudagraph

output:
  results_dir: analysis/results/jetson    # directory for result data
